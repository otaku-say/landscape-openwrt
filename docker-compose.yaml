services:
  openwrt:
    image: ghcr.io/otaku-say/landscape-openwrt:latest
    container_name: landscape-openwrt
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    # 必须由 OpenWrt 的 /sbin/init 保持 PID 1，不要添加 init: true。
    labels:
      ld_flow_edge: "true"
    cap_add:
      - NET_ADMIN
      - BPF
      - PERFMON
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      # 必填：设置 root 的 LuCI 和 SSH 登录密码，不限制长度或复杂度。
      # 每次启动均以此值设置密码；修改后执行 docker compose up -d。
      # 密码含 $ 时写为 $$，避免 Compose 插值。不需要 .env。
      LAND_ROOT_PASSWORD: "CHANGE_ME_BEFORE_START"
      # 使用 IANA 时区名称；只影响容器显示，不修改宿主机时钟。
      TZ: "Asia/Shanghai"
      # 仅首次初始化 DNS；之后由 LuCI/PassWall 维护。
      LAND_DNS_ADDR: "223.5.5.5"
      LAND_REDIRECT_LOG_LEVEL: "INFO"
    sysctls:
      net.ipv4.conf.lo.accept_local: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
    ports:
      # 只绑定现有 LAN 地址，避免占用 Landscape 的 80/443。
      - "10.10.10.1:8000:80"
      - "10.10.10.1:8443:443"
      - "10.10.10.1:2222:22"
    volumes:
      - type: bind
        source: /root/.lkit/landscape/data/unix_link
        target: /ld_unix_link
        read_only: true
        bind:
          create_host_path: false
      # 不持久化整个 /etc 或根目录，否则会遮住新镜像文件。
      # 大版本重构使用全新卷，不读取或迁移旧 OpenWrt 配置。
      - landscape-openwrt-config:/etc/config
      - landscape-openwrt-dropbear:/etc/dropbear
    networks:
      edge:
        ipv4_address: 172.66.66.2
        ipv6_address: fd70:6c61:6e64:66::2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    # 在 Landscape 将 landscape-openwrt 设为 LAN，同时启用 LANv6 和 LAN 路由（LR）。
    # LANv6 选上游 PD 的空闲 /64、纯 RA；不要填写固定运营商前缀。
    name: landscape-openwrt
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: landscape-openwrt
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.66.66.0/24
          gateway: 172.66.66.1
        - subnet: fd70:6c61:6e64:66::/64
          gateway: fd70:6c61:6e64:66::1

volumes:
  immortalwrt-config:
  immortalwrt-dropbear:

services:
  openwrt:
    image: ${OPENWRT_IMAGE:?Set OPENWRT_IMAGE in .env}
    container_name: ${CONTAINER_NAME:?Set CONTAINER_NAME in .env}
    platform: linux/amd64
    restart: ${RESTART_POLICY:?Set RESTART_POLICY in .env}
    privileged: true
    # 接应运行条件固定：单网桥、cgroup v2、/sbin/init 为 PID 1，不能加 init: true。
    labels:
      ld_flow_edge: "true"
    cap_add:
      - NET_ADMIN
      - BPF
      - PERFMON
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      LAND_ROOT_PASSWORD: ${LAND_ROOT_PASSWORD:?Set LAND_ROOT_PASSWORD in .env}
      TZ: ${TZ:?Set TZ in .env}
      LAND_DNS_ADDR: ${LAND_DNS_ADDR:?Set LAND_DNS_ADDR in .env}
      LAND_REDIRECT_LOG_LEVEL: ${LAND_REDIRECT_LOG_LEVEL:?Set LAND_REDIRECT_LOG_LEVEL in .env}
    sysctls:
      net.ipv4.conf.lo.accept_local: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
    ports:
      - "${LAN_BIND_IP:?Set LAN_BIND_IP in .env}:${LUCI_HTTP_PORT:?Set LUCI_HTTP_PORT in .env}:80"
      - "${LAN_BIND_IP:?Set LAN_BIND_IP in .env}:${LUCI_HTTPS_PORT:?Set LUCI_HTTPS_PORT in .env}:443"
      - "${LAN_BIND_IP:?Set LAN_BIND_IP in .env}:${SSH_PORT:?Set SSH_PORT in .env}:22"
    volumes:
      - type: bind
        source: ${LANDSCAPE_SOCKET_DIR:?Set LANDSCAPE_SOCKET_DIR in .env}
        target: /ld_unix_link
        read_only: true
        bind:
          create_host_path: false
      # 全新配置卷，不挂载旧版 OpenWrt 配置或整个 /etc。
      - landscape-openwrt-config:/etc/config
      - landscape-openwrt-dropbear:/etc/dropbear
    networks:
      edge:
        ipv4_address: ${EDGE_IPV4_ADDRESS:?Set EDGE_IPV4_ADDRESS in .env}
        ipv6_address: ${EDGE_IPV6_ADDRESS:?Set EDGE_IPV6_ADDRESS in .env}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:?Set LOG_MAX_SIZE in .env}
        max-file: ${LOG_MAX_FILES:?Set LOG_MAX_FILES in .env}

networks:
  edge:
    # 在 Landscape 对此网桥启用 LAN、LANv6（上游 PD 的纯 RA）和 LAN 路由（LR）。
    name: ${EDGE_NETWORK_NAME:?Set EDGE_NETWORK_NAME in .env}
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: ${EDGE_BRIDGE_NAME:?Set EDGE_BRIDGE_NAME in .env}
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: ${EDGE_IPV4_SUBNET:?Set EDGE_IPV4_SUBNET in .env}
          gateway: ${EDGE_IPV4_GATEWAY:?Set EDGE_IPV4_GATEWAY in .env}
        - subnet: ${EDGE_IPV6_SUBNET:?Set EDGE_IPV6_SUBNET in .env}
          gateway: ${EDGE_IPV6_GATEWAY:?Set EDGE_IPV6_GATEWAY in .env}

volumes:
  landscape-openwrt-config:
    name: ${CONFIG_VOLUME_NAME:?Set CONFIG_VOLUME_NAME in .env}
  landscape-openwrt-dropbear:
    name: ${DROPBEAR_VOLUME_NAME:?Set DROPBEAR_VOLUME_NAME in .env}

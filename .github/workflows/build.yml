name: Check upstreams and publish

on:
  push:
    branches: [main]
    paths-ignore: ['.github/activity']
  schedule:
    # UTC 00:23 = Asia/Shanghai 08:23; GitHub may delay scheduled jobs.
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when all inputs are unchanged
        type: boolean
        default: false
      first_build:
        description: Initialize a package that has not been published yet
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: landscape-openwrt-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/otaku-say/landscape-openwrt

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.inputs.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate source
        run: |
          python3 -m unittest discover -s tests -v
          shellcheck -S warning start.sh rootfs/usr/libexec/* rootfs/etc/hotplug.d/iface/* scripts/*.sh
          shellcheck -S warning -s ash -e SC2034 rootfs/etc/init.d/*
          docker compose --env-file .env.example -f docker-compose.yaml config --quiet
          python3 scripts/test-compose.py
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and compare immutable inputs
        id: inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
          FIRST: ${{ inputs.first_build || github.event_name == 'push' }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          if [[ "$FIRST" == true ]]; then args+=(--first-build); fi
          python3 scripts/upstreams.py --image "$IMAGE" "${args[@]}"
      - name: Upload resolved build inputs
        if: steps.inputs.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-inputs
          path: build/
          retention-days: 1
      - name: Unchanged inputs
        if: steps.inputs.outputs.build != 'true'
        run: echo 'Stable ImmortalWrt rootfs, PassWall APK pair, handler and source are unchanged; no rebuild.' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            test: true
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            test: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-inputs
          path: build/
      - name: Load inputs for build-args
        id: vars
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          state = json.load(open('build/upstream.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key, value in state.items():
                  if key != 'arches' and isinstance(value, str):
                      f.write(f'{key}={value}\n')
              for arch, meta in state['arches'].items():
                  for key, value in meta.items():
                      if isinstance(value, str):
                          f.write(f'{key}_{arch}={value}\n')
          PYEOF
      - name: Generate per-arch tags
        id: tags
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version='${{ steps.vars.outputs.immortalwrt_version }}'
          passwall='${{ steps.vars.outputs.passwall_release }}'
          handler='${{ steps.vars.outputs.handler_version }}'
          suffix="${PLATFORM#linux\/}"
          {
            echo 'tags<<TAGSEOF'
            echo "${IMAGE}:latest-${suffix}"
            echo "${IMAGE}:immortalwrt-${version}-${suffix}"
            echo "${IMAGE}:passwall-${passwall}-${suffix}"
            echo "${IMAGE}:landscape-${handler}-${suffix}"
            echo 'TAGSEOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 candidate for testing
        if: matrix.test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: landscape-openwrt:test
          provenance: false
          build-args: |
            IMMORTALWRT_VERSION=${{ steps.vars.outputs.immortalwrt_version }}
            ROOTFS_SHA256_AMD64=${{ steps.vars.outputs.rootfs_sha256_amd64 }}
            ROOTFS_SHA256_ARM64=${{ steps.vars.outputs.rootfs_sha256_arm64 }}
            PASSWALL_VERSION=${{ steps.vars.outputs.passwall_version }}
            INPUTS_DIGEST=${{ steps.vars.outputs.inputs_digest }}
            HANDLER_VERSION=${{ steps.vars.outputs.handler_version }}
            HANDLER_SHA256_AMD64=${{ steps.vars.outputs.handler_sha256_amd64 }}
            HANDLER_SHA256_ARM64=${{ steps.vars.outputs.handler_sha256_arm64 }}
            SOURCE_REVISION=${{ steps.vars.outputs.source_revision }}
            BUILD_DATE=${{ steps.vars.outputs.resolved_at }}
            DEPENDENCY_FEED_SHA256_AMD64=${{ steps.vars.outputs.dependency_feed_sha256_amd64 }}
            DEPENDENCY_FEED_SHA256_ARM64=${{ steps.vars.outputs.dependency_feed_sha256_arm64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install isolated network test dependencies
        if: matrix.test
        run: |
          python3 -m venv build/test-venv
          build/test-venv/bin/pip install -r tests/requirements.txt
      - name: Boot and test actual OpenWrt candidate
        if: matrix.test
        timeout-minutes: 12
        run: bash scripts/smoke-test.sh landscape-openwrt:test
      - name: Publish per-arch tags
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMMORTALWRT_VERSION=${{ steps.vars.outputs.immortalwrt_version }}
            ROOTFS_SHA256_AMD64=${{ steps.vars.outputs.rootfs_sha256_amd64 }}
            ROOTFS_SHA256_ARM64=${{ steps.vars.outputs.rootfs_sha256_arm64 }}
            PASSWALL_VERSION=${{ steps.vars.outputs.passwall_version }}
            INPUTS_DIGEST=${{ steps.vars.outputs.inputs_digest }}
            HANDLER_VERSION=${{ steps.vars.outputs.handler_version }}
            HANDLER_SHA256_AMD64=${{ steps.vars.outputs.handler_sha256_amd64 }}
            HANDLER_SHA256_ARM64=${{ steps.vars.outputs.handler_sha256_arm64 }}
            SOURCE_REVISION=${{ steps.vars.outputs.source_revision }}
            BUILD_DATE=${{ steps.vars.outputs.resolved_at }}
            DEPENDENCY_FEED_SHA256_AMD64=${{ steps.vars.outputs.dependency_feed_sha256_amd64 }}
            DEPENDENCY_FEED_SHA256_ARM64=${{ steps.vars.outputs.dependency_feed_sha256_arm64 }}
          cache-from: type=gha
      - name: Preserve test diagnostics
        if: matrix.test && always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            build/smoke-*.log
          if-no-files-found: ignore
          retention-days: 30

  manifest:
    needs: [check, build]
    runs-on: ubuntu-24.04
    if: needs.check.outputs.build == 'true'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: build-inputs
          path: build/
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        run: |
          version=$(jq -r '.immortalwrt_version' build/upstream.json)
          passwall=$(jq -r '.passwall_release' build/upstream.json)
          handler=$(jq -r '.handler_version' build/upstream.json)
          amd64="${IMAGE}:immortalwrt-${version}-amd64"
          arm64="${IMAGE}:immortalwrt-${version}-arm64"
          for tag in "latest" "immortalwrt-$version" "passwall-$passwall" "landscape-$handler"; do
            docker buildx imagetools create --tag "$IMAGE:$tag" "$amd64" "$arm64"
          done
      - name: Cleanup stale versions (keep last10)
        if: always() && success()
        run: |
          owner="${IMAGE%/*}"
          repo="${IMAGE#*/}"
          versions=$(
            gh api -X GET \
              "/users/$owner/packages/container/$repo/versions?per_page=100" \
              --jq '[.[] | {id, created_at, tags: .metadata.container.tags}]' 2>/dev/null
          ) || true
          printf '%s\n' "$versions" | python3 - << 'PYEOF' -
          import json, sys
          try:
              versions = json.load(sys.stdin)
          except (json.JSONDecodeError, TypeError):
              print("No versions to clean up"); sys.exit(0)
          def snapshot_sort_key(v):
              tags = set((v.get('tags') or []))
              versioned = sorted(t for t in tags if t != 'latest')
              primary = versioned[0] if versioned else ''
              nums = []
              for part in primary.split('-', 1)[-1].split('.'):
                  try: nums.append(int(part.split('-')[0]))
                  except ValueError: nums.append(0)
              return (tuple(nums), len(tags), v['created_at'])
          ordered = sorted(versions, key=snapshot_sort_key, reverse=True)
          excess = ordered[10:]
          if not excess:
              print("No stale versions")
          else:
              ids = [str(v['id']) for v in excess]
              print(f"Deleting {len(ids)} stale versions: {', '.join(ids)}")
              with open('/tmp/cleanup_ids.txt', 'w') as f:
                  f.write('\n'.join(ids))
          PYEOF
          test -s /tmp/cleanup_ids.txt || exit 0
          failed=0
          while IFS= read -r vid; do
            if ! gh api -X DELETE \
                "/users/$owner/packages/container/$repo/versions/$vid" \
                --silent 2>/dev/null; then
              echo "::warning::Failed to delete version $vid"
              failed=$((failed + 1))
            fi
          done < /tmp/cleanup_ids.txt
          echo "Deleted: $(( $(wc -l < /tmp/cleanup_ids.txt) - failed )) stale versions"
      - name: Create GitHub release with upstream changelog
        if: success()
        run: |
          version=$(jq -r '.immortalwrt_version' build/upstream.json)
          passwall=$(jq -r '.passwall_release' build/upstream.json)
          handler=$(jq -r '.handler_version' build/upstream.json)
          export IW_TAG="$version" PW_TAG="$passwall" LW_TAG="$handler"
          python3 - << 'PYEOF'
          import urllib.request, urllib.error, json, os, re
          headers = {"Accept": "application/vnd.github+json",
                     "User-Agent": "landscape-openwrt-ci"}
          token = os.environ.get('GH_TOKEN')
          if token:
              headers["Authorization"] = f"Bearer {token}"
          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())
          def immortalwrt_notes(version):
              # ImmortalWrt 不发 GitHub Release；用相邻稳定 tag 之间的 commits 作为版本日志。
              tag = f'v{version}'
              tags = fetch('https://api.github.com/repos/immortalwrt/immortalwrt/tags?per_page=100')
              stable = sorted(
                  (t for t in tags if re.fullmatch(r'v\d+\.\d+\.\d+', t.get('name', ''))),
                  key=lambda t: tuple(map(int, t['name'][1:].split('.'))), reverse=True)
              prev = None
              for i, t in enumerate(stable):
                  if t['name'] == tag and i + 1 < len(stable):
                      prev = stable[i + 1]['name']
                      break
              if not prev:
                  return '_No previous stable tag found._'
              try:
                  cmp = fetch(f'https://api.github.com/repos/immortalwrt/immortalwrt/compare/{prev}...{tag}')
              except urllib.error.HTTPError:
                  return '_Commit comparison unavailable._'
              commits = cmp.get('commits', [])
              if not commits:
                  return '_No commits between releases._'
              lines = [f'Upstream commits ({prev} → {tag}):'] + [
                  f'- {c["commit"]["message"].splitlines()[0]}' for c in commits[:20]
              ]
              if len(commits) > 20:
                  lines.append(f'- …and {len(commits) - 20} more commits')
              return '\n'.join(lines)
          entries = [
              ('ImmortalWrt',       'immortalwrt/immortalwrt',          os.environ['IW_TAG'], immortalwrt_notes),
              ('PassWall',          'Openwrt-Passwall/openwrt-passwall', os.environ['PW_TAG'], None),
              ('Landscape handler', 'ThisSeanZhang/landscape',          os.environ['LW_TAG'], None),
          ]
          with open('build/release_notes.txt', 'w') as notes:
              for label, repo, tag, fallback in entries:
                  notes.write(f'## {label} `{tag}`\n\n')
                  try:
                      r = fetch(f'https://api.github.com/repos/{repo}/releases/tags/{tag}')
                      body = (r.get('body') or '').strip()
                      notes.write((body or '_No release notes provided._') + '\n')
                  except urllib.error.HTTPError:
                      notes.write((fallback(tag) if fallback else '_See upstream repository for details._') + '\n')
                  notes.write('\n')
          PYEOF
          {
            echo "### Published tested multi-arch image"
            echo "\`$IMAGE:latest\` (linux/amd64, linux/arm64)"
            echo "**ImmortalWrt:** $version &nbsp;|&nbsp; **PassWall:** $passwall &nbsp;|&nbsp; **Landscape:** $handler"
            echo ""
            echo "Tests cover host-console isolation across boot/restart/recreation/shutdown, tagged official-handler traffic through real PassWall TCP/UDP proxy exits over IPv4/IPv6, preserved outbound NAT, native management, passwords, SSH identity, DNS and SLAAC renewal."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/release_notes.txt ]; then
            gh release create "build-${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --title "Build #${{ github.run_id }} — ImmortalWrt $version · PassWall $passwall · Landscape $handler" \
              --notes-file build/release_notes.txt \
              --prerelease 2>/dev/null || echo "::warning::Release creation skipped (non-fatal)"
          fi
      - name: Keep daily checks active in an otherwise idle public repository
        if: github.event_name == 'schedule'
        run: bash scripts/keepalive.sh

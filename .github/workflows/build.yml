name: Check upstreams and publish

on:
  push:
    branches: [main]
    paths-ignore: ['.github/activity']
  schedule:
    # UTC 00:23 = Asia/Shanghai 08:23; GitHub may delay scheduled jobs.
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when all inputs are unchanged
        type: boolean
        default: false
      first_build:
        description: Initialize a package that has not been published yet
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: landscape-openwrt-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/otaku-say/landscape-openwrt

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source
        run: |
          python3 -m unittest discover -s tests -v
          shellcheck -S warning start.sh rootfs/usr/libexec/* rootfs/etc/hotplug.d/iface/* scripts/*.sh
          shellcheck -S warning -s ash -e SC2034 rootfs/etc/init.d/*
          docker compose --env-file .env.example -f docker-compose.yaml config --quiet
          python3 scripts/test-compose.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and compare immutable inputs
        id: inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
          FIRST: ${{ inputs.first_build || github.event_name == 'push' }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          if [[ "$FIRST" == true ]]; then args+=(--first-build); fi
          python3 scripts/upstreams.py --image "$IMAGE" "${args[@]}"
      - name: Build candidate, without publishing
        if: steps.inputs.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: landscape-openwrt:test
          provenance: false
          build-args: |
            IMMORTALWRT_VERSION=${{ steps.inputs.outputs.immortalwrt_version }}
            ROOTFS_SHA256=${{ steps.inputs.outputs.rootfs_sha256 }}
            PASSWALL_VERSION=${{ steps.inputs.outputs.passwall_version }}
            INPUTS_DIGEST=${{ steps.inputs.outputs.inputs_digest }}
            HANDLER_VERSION=${{ steps.inputs.outputs.handler_version }}
            HANDLER_SHA256=${{ steps.inputs.outputs.handler_sha256 }}
            SOURCE_REVISION=${{ steps.inputs.outputs.source_revision }}
            BUILD_DATE=${{ steps.inputs.outputs.resolved_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install isolated network test dependencies
        if: steps.inputs.outputs.build == 'true'
        run: |
          python3 -m venv build/test-venv
          build/test-venv/bin/pip install -r tests/requirements.txt
      - name: Boot and test actual OpenWrt candidate
        if: steps.inputs.outputs.build == 'true'
        timeout-minutes: 12
        run: bash scripts/smoke-test.sh landscape-openwrt:test
      - name: Publish only the tested image
        if: steps.inputs.outputs.build == 'true'
        env:
          HANDLER: ${{ steps.inputs.outputs.handler_version }}
          PASSWALL: ${{ steps.inputs.outputs.passwall_version }}
        run: |
          version=$(docker run --rm --entrypoint /bin/sh landscape-openwrt:test -c '. /etc/openwrt_release; printf "%s" "$DISTRIB_RELEASE"')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Update latest last; failed earlier pushes cannot advance the comparison state.
          for tag in "immortalwrt-$version" "passwall-$PASSWALL" "redirect_pkg_handler-$HANDLER" "immortalwrt-$version-passwall-$PASSWALL" latest; do
            docker tag landscape-openwrt:test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          {
            echo '## Published tested image'
            echo "\`$IMAGE:latest\`"
            echo "ImmortalWrt: $version; PassWall: $PASSWALL; redirect_pkg_handler: $HANDLER"
            echo 'Tests cover boot, LuCI login/password rotation, PassWall/Xray, DNS, NAT44/66, SLAAC renewal and fresh-generation persistence.'
            echo 'A real Landscape Flow and an external proxy subscription still require deployment acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Unchanged inputs
        if: steps.inputs.outputs.build != 'true'
        run: echo 'Stable ImmortalWrt rootfs, PassWall APK pair, handler and source are unchanged; no rebuild.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build metadata and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/upstream.json
            build/smoke-*.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep daily checks active in an otherwise idle public repository
        if: github.event_name == 'schedule'
        run: bash scripts/keepalive.sh
